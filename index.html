<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9ddc9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <title>Rise Above the Ankle bitters</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171513;
      --orange: #f04a0a;
      --paper: #eee3d1;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(90deg, rgb(18 16 14 / 10%), transparent 16%, transparent 84%, rgb(18 16 14 / 10%)),
        url("assets/risabove-background.png");
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
      font-family: "Permanent Marker", "Chalkduster", "Comic Sans MS", cursive;
    }

    main {
      width: min(100% - 2rem, 760px);
      padding: clamp(2rem, 7vw, 5rem) clamp(1.5rem, 7vw, 4rem);
      text-align: center;
      position: relative;
      isolation: isolate;
    }

    main::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 8% -3%;
      background: radial-gradient(ellipse, rgb(239 228 210 / 88%) 0%, rgb(239 228 210 / 68%) 49%, rgb(239 228 210 / 0%) 78%);
      filter: blur(7px);
    }

    .crown {
      --crown-width: clamp(76px, 13vw, 112px);
      width: var(--crown-width);
      height: calc(var(--crown-width) * .66);
      margin: 0 auto clamp(1.1rem, 3vw, 1.8rem);
      position: relative;
      filter: drop-shadow(3px 4px 0 var(--orange)) drop-shadow(0 6px 2px rgb(23 21 19 / 20%));
      transform: rotate(-4deg);
    }

    .crown::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--ink);
      clip-path: polygon(0 25%, 20% 40%, 24% 7%, 39% 33%, 50% 0, 61% 33%, 76% 7%, 80% 40%, 100% 25%, 88% 94%, 12% 100%);
    }

    .orb {
      position: absolute;
      z-index: 2;
      top: -5px;
      width: 11px;
      aspect-ratio: 1;
      border: 2px solid var(--orange);
      border-radius: 50%;
      background: var(--ink);
      box-shadow: 1px 2px 0 rgb(23 21 19 / 40%);
    }

    .orb-left { left: calc(24% - 5px); }
    .orb-center { left: calc(50% - 5px); top: -8px; }
    .orb-right { left: calc(76% - 5px); }

    .crown::after {
      content: "";
      position: absolute;
      inset: 53% 14% 14%;
      background: repeating-linear-gradient(115deg, transparent 0 8px, var(--orange) 8px 10px, transparent 10px 15px);
      clip-path: polygon(0 0, 100% 0, 94% 100%, 6% 100%);
      opacity: .92;
    }

    .spray {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink);
      box-shadow: 17px 5px 0 -2px var(--orange), -13px 15px 0 -3px var(--ink), 72px -6px 0 -2px var(--ink), 96px 17px 0 -3px var(--orange);
      top: 7px;
      left: -8px;
    }

    h1 {
      margin: 0 auto 1rem;
      max-width: 14ch;
      font-size: clamp(2.5rem, 8vw, 5.7rem);
      line-height: .88;
      letter-spacing: -.055em;
      text-transform: uppercase;
      text-wrap: balance;
      text-shadow: 2px 2px 0 rgb(239 228 210 / 80%);
    }

    h1 span {
      display: block;
      color: var(--orange);
      -webkit-text-stroke: 1px var(--ink);
      paint-order: stroke fill;
      text-shadow: 3px 4px 0 var(--ink);
    }

    p {
      max-width: 35ch;
      margin: 1.4rem auto 0;
      font-family: inherit;
      font-size: clamp(1.2rem, 3.15vw, 1.75rem);
      line-height: 1.34;
      letter-spacing: .015em;
      text-shadow: 1px 1px 0 rgb(239 228 210 / 88%), -1px -1px 0 rgb(239 228 210 / 72%);
      text-wrap: pretty;
    }

    .spark {
      display: inline-block;
      color: var(--orange);
      font-size: .82em;
      transform: rotate(-9deg);
      margin: 0 .12em;
    }

    @media (max-width: 600px) {
      body { background-attachment: scroll; background-position: 48% center; }
      main { width: min(100% - 1rem, 760px); padding-inline: 1.25rem; }
      main::before { inset: 12% -8%; }
      p { max-width: 29ch; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="message-title">
    <div class="crown" aria-hidden="true"><span class="orb orb-left"></span><span class="orb orb-center"></span><span class="orb orb-right"></span><span class="spray"></span></div>
    <h1 id="message-title">Rise Above <span>the Ankle bitters</span></h1>
    <p>—because every step forward begins with believing you can. Keep moving, meet each challenge with courage, and let your own bright spirit lead the way.<span class="spark" aria-hidden="true">✦</span></p>
  </main>
</body>
</html>
